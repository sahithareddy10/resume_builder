# services
redis:
 image: redis:7-alpine
 ports:
 - "6379:6379"
 restart: unless-stopped

backend:
 build: ./backend
 ports:
 - "8000:8000"
 environment:
 - MODEL_NAME=${MODEL_NAME:}
 - MODEL_ADAPTER_PATH=${MODEL_ADAPTER_PATH:}
 - DEVICE=${DEVICE:-cuda}
 - REDIS_URL=redis://redis:6379/0
 depends_on:
 - redis
 volumes:
 - ./uploads:/app/uploads
 - ./outputs:/app/outputs
 restart: unless-stopped

frontend:
 build: ./frontend
 ports:
 - "3001:3001"
 depends_on:
 - backend
 restart: unless-stopped
